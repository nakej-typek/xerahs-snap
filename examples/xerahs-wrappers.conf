# systemd user drop-in for the unit that runs XerahS, e.g.
#   ~/.config/systemd/user/<your-xerahs-unit>.service.d/xerahs-wrappers.conf
# then: systemctl --user daemon-reload && systemctl --user restart <your-xerahs-unit>
# Without a unit, export the same two variables before starting xerahs.
[Service]
# The wrappers shadow slurp and grim for XerahS only
Environment=PATH=%h/.local/lib/xerahs-wrappers:/usr/local/bin:/usr/bin
# The omasnap wrapper opens the annotation editor on the monitor where you selected
Environment=XERAHS_OMASNAP_PATH=%h/.local/lib/xerahs-wrappers/omasnap
